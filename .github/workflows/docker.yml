name: Build Wuzbot Engine

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/douglassilsouza/wuzbot-engine:latest


      - name: Prepare and Copy .env to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            PORTAINER_DATA=$(docker volume inspect portainer_data --format '{{.Mountpoint}}' 2>/dev/null || echo '/var/lib/docker/volumes/portainer_data/_data')
            STACK_DIR=$(grep -rl "wuzbot-engine" $PORTAINER_DATA/compose/*/docker-compose.yml | head -n 1 | xargs dirname)
            if [ -n "$STACK_DIR" ]; then
              echo "${{ secrets.ENV_FILE_CONTENT }}" > $STACK_DIR/.env
              echo "Variáveis salvas no diretório da Stack: $STACK_DIR"
            else
              echo "Erro: Stack não encontrada!"
              exit 1
            fi

      - name: Deploy to Portainer via Webhook
        if: success()
        run: |
          if [ -n "${{ secrets.PORTAINER_WEBHOOK_URL }}" ]; then
            curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
          else
            echo "Portainer Webhook URL not set. Skipping deploy."
          fi