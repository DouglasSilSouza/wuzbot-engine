name: Build Wuzbot Engine

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/douglassilsouza/wuzbot-engine:latest


      - name: Prepare and Copy .env to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/gastoapp/envs
            echo "${{ secrets.ENV_FILE_CONTENT }}" > /opt/gastoapp/envs/wuzbot-engine.env

      - name: Deploy to Portainer via Webhook
        if: success()
        run: |
          if [ -n "${{ secrets.PORTAINER_WEBHOOK_URL }}" ]; then
            curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
          else
            echo "Portainer Webhook URL not set. Skipping deploy."
          fi